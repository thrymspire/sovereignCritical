[package]
name = "sovereign-critical"
version = "0.1.0"
description = "Master Critical Path local evidence-backed operational system"
authors = ["Master Critical Path project owners"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "sovereign_critical_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-notification = "2.4.0"
