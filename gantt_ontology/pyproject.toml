[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gantt-ontology"
version = "1.0.0"
description = "Canonical Gantt Parameterization Ontology — schema + Pydantic models. No data import."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "jsonschema"]

[tool.setuptools.packages.find]
where = ["src"]
