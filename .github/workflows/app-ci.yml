name: Application CI

on:
  push:
    branches:
      - project-owners/master-critical-path-v1
      - project-owners/master-critical-path-codespace
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Select current stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Check Tauri shell
        id: cargo-check
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo check --manifest-path app/src-tauri/Cargo.toml 2>&1 | tee /tmp/mcp-cargo-check.log
          status=${PIPESTATUS[0]}
          echo "$status" > /tmp/mcp-cargo-check.status
          exit "$status"

      - name: Preserve Tauri compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tauri-cargo-check-diagnostics
          path: |
            /tmp/mcp-cargo-check.log
            /tmp/mcp-cargo-check.status
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Tauri check result
        if: always()
        shell: bash
        run: |
          status=$(cat /tmp/mcp-cargo-check.status)
          if [ "$status" -ne 0 ]; then
            echo "Tauri cargo check failed with exit code $status."
            exit "$status"
          fi
